<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – Pranil</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header></header>

  <main>

    <section class="contact-header">
      <h1>Contact</h1>
      <p>Feel free to reach out for work, collaborations, or just to say hi.</p>
    </section>

    <section class="contact-links">

      <article class="contact-item">
        <h2>Email</h2>
        <!--
          mailto: opens the user's email app automatically
        -->
        <a href="mailto:pparajuli15@gmail.com">pparajuli15@gmail.com</a>
      </article>

      <article class="contact-item">
        <h2>GitHub</h2>
        <!--
          target="_blank" opens link in a new tab
          rel="noopener" is a security best practice when using target="_blank"
          — it prevents the new tab from accessing your page
        -->
        <a href="https://github.com/praniil" target="_blank" rel="noopener">github.com/praniil</a>
      </article>

      <article class="contact-item">
        <h2>LinkedIn</h2>
        <a href="https://linkedin.com/in/pranil-parajuli" target="_blank" rel="noopener">pranil-parajuli</a>
      </article>

      <article class="contact-item">
        <h2>HuggingFace</h2>
        <a href="https://huggingface.co/Pranilllllll" target="_blank" rel="noopener">Pranilllllll</a>
      </article>

      <article class="contact-item">
        <h2>Location</h2>
        <p>Tokha-8, Kathmandu, Nepal</p>
      </article>

      <article class="contact-item">
        <h2>Phone</h2>
        <!--
          tel: opens the phone dialer on mobile
        -->
        <a href="tel:+9779840251398">+977-9840251398</a>
      </article>

    </section>

  </main>

  <footer></footer>

  <script type="module" src="components.js"></script>
</body>
</html>
